<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>make contant</h1>
    <input type="text" name="fullname" placeholder="fullname" maxlength="100"> <br>
    <input type="password" name="pwd" placeholder="password" minlength="8" maxlength="25"><br>
    <input type="email" name="email" required placeholder="name@example.com"><br>
    <input type="tel" name="phone" pattern="^\+?\d{7,15}$" placeholder="+972501234567"><br>
    <input type="url" name="website" placeholder="https://example.com"><br>
    <input type="number" name="age" placeholder="age" min="0" max="120" step="1"><br>
     <input type="range" name="volume" min="0" max="100"> <br>
     <input type="date" name="birthday" placeholder="birthday"> <br>
     <input type="datetime-local" name="meeting"> <br>
    <input type="color" name="favcolor" value="#ff0000"><br>
    <label><input type="checkbox" name="subscribe" value="yes">im intrasted in getting updates</label><br>
    <p>your gender</p>
    <label><input type="radio" name=" gender" value="male"></label>
    <label><input type="radio" name=" gender" value="female"></label><br>
    <label> msg </label>
    <textarea name="msg" rows="4" cols="30"     placeholder="write your message here"></textarea><br>
    <select name="city" required><br>
    <option value="choose city"></option><br>
    <option value="tlv"></option><br>
    <option value="jer"></option><br>
    </select>
    <input type="submit" value=send>
</body>
</html>
